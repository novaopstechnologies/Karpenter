# __NODE_ROLE_NAME__ and __CLUSTER_NAME__ are substituted by Terraform
# (modules/karpenter) before this file is applied.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: __NODE_ROLE_NAME__
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  amiSelectorTerms:
    - alias: al2023@latest
  tags:
    karpenter.sh/discovery: __CLUSTER_NAME__
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpPutResponseHopLimit: 2
    httpTokens: required
